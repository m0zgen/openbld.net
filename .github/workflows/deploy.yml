name: Build and Deploy

on:
  push:
    branches:
      - dev
      - dev-up-3.9→3.10
      - upgrade/deps-safe

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate package manager from package.json
        run: corepack install

      - name: Show versions
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build website
        run: yarn build

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/upgrade/deps-safe'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
